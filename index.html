<!DOCTYPE html>
<html>
<head>
    <title>Zee Mail Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <button onclick="createNewMailTm()">Create New Mail.tm Account</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const FIXED_PASSWORD = "Zero2944"; // Password အသေ

        async function createNewMailTm() {
            try {
                // 1. Domain ယူခြင်း
                let domRes = await fetch('https://api.mail.tm/domains');
                let domData = await domRes.json();
                let domain = domData['hydra:member'][0].domain;
                let username = 'zee_' + Math.floor(Math.random() * 100000);
                let email = `${username}@${domain}`;

                // 2. Account ဆောက်ခြင်း
                let createRes = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: email, password: FIXED_PASSWORD })
                });

                if (createRes.ok) {
                    // Password မပြပါ
                    tg.showAlert(`✅ Created Successfully:\n${email}`);
                } else {
                    tg.showAlert('Failed to create account. Please try again.');
                }
            } catch (e) {
                tg.showAlert('Error connecting to Mail.tm server.');
            }
        }
    </script>
</body>
</html>
