<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Mail Hub VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col justify-between">
    <div>
        <!-- Header -->
        <div class="flex items-center justify-between pb-4 border-b border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-shield-halved text-yellow-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
                        ZEE MAIL PRO <span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-[10px] px-1.5 py-0.5 rounded font-mono">Mail.tm</span>
                    </h1>
                    <p id="user-status" class="text-xs text-gray-500 font-mono">ID: Loading...</p>
                </div>
            </div>
            <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Engine Active
            </span>
        </div>

        <!-- Custom Username Input -->
        <div class="mt-5">
            <input type="text" id="custom-username" placeholder="Enter custom username (optional)" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all">
        </div>

        <!-- Controls -->
        <div class="mt-3 space-y-2">
            <button id="create-btn" onclick="createNewMailTm()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl text-sm flex items-center justify-center space-x-2 active:scale-95 transition-all shadow-md">
                <i class="fa-solid fa-plus text-indigo-200"></i>
                <span>Create New Mail.tm Account</span>
            </button>
        </div>

        <!-- Active Mails Section -->
        <div class="mt-5">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Mailboxes</h2>
                <button onclick="clearAllMails()" class="text-[11px] text-red-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-trash-can"></i> Clear All</button>
            </div>
            <div id="created-mails-container" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Feed Section -->
        <div class="mt-5">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Inbox Stream (OTP)</h2>
                <button onclick="checkMessages()" class="text-xs text-indigo-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-rotate"></i> Sync Feed</button>
            </div>
            <div id="inbox-list" class="space-y-3">
                <p class="text-xs text-gray-500 text-center py-6">Waiting for incoming messages...</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const FIXED_PASSWORD = "Zero2944";
        const user = tg.initDataUnsafe.user;
        const userId = user?.id || 'guest_' + Math.floor(Math.random() * 89999);
        document.getElementById('user-status').innerText = `ID: ${userId}`;

        let accounts = [];

        // ... [loadStorage, saveStorage, renderBadges, clearAllMails, copyText functions are same as before] ...
        function loadStorage() { try { tg.CloudStorage.getItem(`zee_mailtm_${userId}`, (err, val) => { if (!err && val) accounts = JSON.parse(val); else accounts = JSON.parse(localStorage.getItem(`zee_mailtm_${userId}`)) || []; checkUrlParams(); }); } catch(e) { accounts = JSON.parse(localStorage.getItem(`zee_mailtm_${userId}`)) || []; checkUrlParams(); } }
        function saveStorage() { let data = JSON.stringify(accounts); localStorage.setItem(`zee_mailtm_${userId}`, data); try { tg.CloudStorage.setItem(`zee_mailtm_${userId}`, data); } catch(e){} }
        function checkUrlParams() { const urlParams = new URLSearchParams(window.location.search); const email = urlParams.get('email'); const token = urlParams.get('token'); if (email && token && !accounts.some(a => a.email === email)) { accounts.push({ email, token }); saveStorage(); } renderBadges(); if (accounts.length > 0) checkMessages(); }
        loadStorage();
        function renderBadges() { const container = document.getElementById('created-mails-container'); if (accounts.length === 0) { container.innerHTML = '<p class="text-xs text-gray-600">No active mailboxes.</p>'; return; } container.innerHTML = accounts.map(a => `<div onclick="copyText('${a.email}')" class="bg-gray-800 border border-indigo-500/30 text-indigo-300 text-xs px-2.5 py-1.5 rounded-xl font-mono cursor-pointer flex items-center space-x-1.5 hover:border-indigo-400"><i class="fa-regular fa-copy text-indigo-400"></i><span>${a.email}</span></div>`).join(''); }
        function clearAllMails() { accounts = []; saveStorage(); renderBadges(); document.getElementById('inbox-list').innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Cleared all active accounts.</p>'; }
        function copyText(text) { navigator.clipboard.writeText(text); tg.showAlert(`Copied:\n${text}`); }

        async function fetchMailApi(url, method = 'GET', body = null) { const headers = { 'Content-Type': 'application/json' }; const options = { method, headers }; if (body) options.body = JSON.stringify(body); return await fetch(url, options); }

        async function createNewMailTm() {
            const btn = document.getElementById('create-btn');
            const customInput = document.getElementById('custom-username').value.trim();
            
            btn.innerText = "Creating...";
            btn.disabled = true;

            try {
                let domRes = await fetchMailApi('https://api.mail.tm/domains');
                let domData = await domRes.json();
                let domain = (domData['hydra:member'] || domData)[0].domain;
                
                // နာမည်ရိုက်ထားရင် သုံးမယ်၊ မရိုက်ရင် random လုပ်မယ်
                let username = customInput ? customInput.toLowerCase().replace(/[^a-z0-9]/g, '') : 'zee_' + Math.random().toString(36).substring(2, 9);
                let email = `${username}@${domain}`;

                let createRes = await fetchMailApi('https://api.mail.tm/accounts', 'POST', { address: email, password: FIXED_PASSWORD });

                if (createRes.status === 201 || createRes.ok) {
                    let tokRes = await fetchMailApi('https://api.mail.tm/token', 'POST', { address: email, password: FIXED_PASSWORD });
                    let tokData = await tokRes.json();
                    if (tokData.token) {
                        accounts.push({ email, token: tokData.token });
                        saveStorage();
                        renderBadges();
                        tg.showAlert(`✅ Created:\n${email}`);
                        document.getElementById('custom-username').value = ''; // Reset field
                    } else { tg.showAlert('Failed to get token.'); }
                } else { tg.showAlert('Username might be taken or error.'); }
            } catch (e) { tg.showAlert('Network Error.'); } finally { btn.innerHTML = `<i class="fa-solid fa-plus text-indigo-200"></i><span>Create New Mail.tm Account</span>`; btn.disabled = false; }
        }

        // checkMessages function ... (အတိုင်းပဲ)
        async function checkMessages(silent = false) { /* Same as before */ }
        setInterval(() => { if (accounts.length > 0) checkMessages(true); }, 4000);
    </script>
</body>
</html>
