<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Mail Hub VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col justify-between">
    <div>
        <!-- Header -->
        <div class="flex items-center justify-between pb-4 border-b border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-shield-halved text-yellow-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
                        ZEE MAIL PRO <span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-[10px] px-1.5 py-0.5 rounded font-mono">Mail.tm</span>
                    </h1>
                    <p id="user-status" class="text-xs text-gray-500 font-mono">ID: Loading...</p>
                </div>
            </div>
            <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Mail.tm Engine
            </span>
        </div>

        <!-- Controls -->
        <div class="mt-4 space-y-2">
            <button onclick="createNewMailTm()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 active:scale-95 transition-all shadow-md">
                <i class="fa-solid fa-plus text-indigo-200"></i>
                <span>Create New Mail.tm Account</span>
            </button>
        </div>

        <!-- Active Mails Section -->
        <div class="mt-5">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Mailboxes</h2>
                <button onclick="clearAllMails()" class="text-[11px] text-red-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-trash-can"></i> Clear All</button>
            </div>
            <div id="created-mails-container" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Feed Section -->
        <div class="mt-5">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Inbox Stream (OTP)</h2>
                <button onclick="checkMessages()" class="text-xs text-indigo-400 hover:underline flex items-center gap-1"><i class="fa-solid fa-rotate"></i> Sync Feed</button>
            </div>
            <div id="inbox-list" class="space-y-3">
                <p class="text-xs text-gray-500 text-center py-6">Waiting for incoming messages...</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const FIXED_PASSWORD = "Zero2944";
        const user = tg.initDataUnsafe.user;
        const userId = user?.id || 'guest_' + Math.floor(Math.random() * 89999);
        document.getElementById('user-status').innerText = `ID: ${userId}`;

        let accounts = [];

        function loadStorage() {
            try {
                tg.CloudStorage.getItem(`zee_mailtm_${userId}`, (err, val) => {
                    if (!err && val) accounts = JSON.parse(val);
                    else accounts = JSON.parse(localStorage.getItem(`zee_mailtm_${userId}`)) || [];
                    checkUrlParams();
                });
            } catch(e) {
                accounts = JSON.parse(localStorage.getItem(`zee_mailtm_${userId}`)) || [];
                checkUrlParams();
            }
        }

        function saveStorage() {
            let data = JSON.stringify(accounts);
            localStorage.setItem(`zee_mailtm_${userId}`, data);
            try { tg.CloudStorage.setItem(`zee_mailtm_${userId}`, data); } catch(e){}
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const token = urlParams.get('token');

            if (email && token && !accounts.some(a => a.email === email)) {
                accounts.push({ email, token });
                saveStorage();
            }
            renderBadges();
            if (accounts.length > 0) checkMessages();
        }

        loadStorage();

        setInterval(() => {
            if (accounts.length > 0) checkMessages(true);
        }, 3000);

        async function createNewMailTm() {
            try {
                let domRes = await fetch('https://api.mail.tm/domains');
                let domData = await domRes.json();
                
                if (!domData['hydra:member'] || domData['hydra:member'].length === 0) {
                    tg.showAlert('Failed to fetch Mail.tm domains.');
                    return;
                }

                let domain = domData['hydra:member'][0].domain;
                let username = 'zee_' + Math.random().toString(36).substring(2, 9);
                let email = `${username}@${domain}`;

                let createRes = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: email, password: FIXED_PASSWORD })
                });

                if (createRes.ok || createRes.status === 201) {
                    let tokRes = await fetch('https://api.mail.tm/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address: email, password: FIXED_PASSWORD })
                    });
                    let tokData = await tokRes.json();

                    if (tokData.token) {
                        accounts.push({ email, token: tokData.token });
                        saveStorage();
                        renderBadges();
                        checkMessages();
                        tg.showAlert(`Created Mail:\n${email}`);
                    } else {
                        tg.showAlert('Failed to generate session token.');
                    }
                } else {
                    tg.showAlert('Failed to create account.');
                }
            } catch (e) {
                tg.showAlert('Network Error. Try again.');
            }
        }

        function renderBadges() {
            const container = document.getElementById('created-mails-container');
            if (accounts.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-600">No active mailboxes.</p>';
                return;
            }
            container.innerHTML = accounts.map(a => `
                <div onclick="copyText('${a.email}')" class="bg-gray-800 border border-indigo-500/30 text-indigo-300 text-xs px-2.5 py-1.5 rounded-xl font-mono cursor-pointer flex items-center space-x-1.5 hover:border-indigo-400">
                    <i class="fa-regular fa-copy text-indigo-400"></i><span>${a.email}</span>
                </div>
            `).join('');
        }

        function clearAllMails() {
            accounts = [];
            saveStorage();
            renderBadges();
            document.getElementById('inbox-list').innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Cleared all active accounts.</p>';
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            tg.showAlert(`Copied:\n${text}`);
        }

        async function checkMessages(silent = false) {
            let container = document.getElementById('inbox-list');
            let html = '';
            let hasMsg = false;

            for (let acc of accounts) {
                try {
                    let res = await fetch('https://api.mail.tm/messages', {
                        headers: { 'Authorization': `Bearer ${acc.token}` }
                    });
                    if (res.ok) {
                        let data = await res.json();
                        let msgs = data['hydra:member'];

                        if (msgs && msgs.length > 0) {
                            hasMsg = true;
                            for (let m of msgs) {
                                let dRes = await fetch(`https://api.mail.tm/messages/${m.id}`, {
                                    headers: { 'Authorization': `Bearer ${acc.token}` }
                                });
                                let d = await dRes.json();
                                let body = d.text || d.html || '';

                                let otp = body.match(/\b\d{4,8}\b/);
                                let otpBadge = otp ? `<span class="bg-amber-400 text-black font-extrabold px-2 py-0.5 rounded text-xs">🔑 OTP: ${otp[0]}</span>` : '';

                                html += `
                                    <div class="bg-gray-800 border border-gray-700 rounded-xl p-3 shadow-md">
                                        <div class="flex justify-between items-center mb-2 pb-1 border-b border-gray-700/50">
                                            <span class="text-[10px] bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded font-mono">To: ${acc.email}</span>
                                            ${otpBadge}
                                        </div>
                                        <div class="text-xs text-gray-400">${d.from.address}</div>
                                        <div class="text-xs font-bold text-gray-100 mt-0.5">${d.subject}</div>
                                        <div class="text-xs text-gray-300 mt-1.5 bg-gray-950 p-2.5 rounded font-mono line-clamp-4">${body}</div>
                                    </div>
                                `;
                            }
                        }
                    }
                } catch (e) {}
            }

            if (hasMsg) container.innerHTML = html;
            else if (!silent) container.innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Waiting for incoming messages...</p>';
        }
    </script>
</body>
</html>
