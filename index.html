<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Mail Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col justify-between">
    <div>
        <!-- Header -->
        <div class="flex items-center justify-between pb-4 border-b border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg">Fake Mail Pro</h1>
                    <p id="user-status" class="text-xs text-gray-400">Loading user info...</p>
                </div>
            </div>
            <span class="px-3 py-1 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-full text-xs font-semibold">v2.0 WebApp</span>
        </div>

        <!-- Controls -->
        <div class="mt-6 space-y-3">
            <button onclick="generateMail('auto')" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all text-white py-3 px-4 rounded-xl font-medium flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Auto Generate Mail</span>
            </button>
            <div class="flex space-x-2">
                <input id="custom-name" type="text" placeholder="Custom mail name..." class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <button onclick="generateMail('custom')" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 px-4 py-2.5 rounded-xl text-sm font-medium active:scale-95 transition-all">Create</button>
            </div>
        </div>

        <!-- Active Mail Card -->
        <div class="mt-6">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Current Mail Address</h2>
            <div id="active-mail-box" class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center justify-between">
                <span id="current-email" class="text-sm font-mono text-indigo-300">No Mail Generated</span>
                <button onclick="copyMail()" class="text-gray-400 hover:text-white p-2"><i class="fa-regular fa-copy"></i></button>
            </div>
        </div>

        <!-- Inbox List -->
        <div class="mt-6">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Inbox / OTP Messages</h2>
                <button onclick="fetchMessages()" class="text-xs text-indigo-400 hover:underline"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
            <div id="inbox-list" class="space-y-3">
                <p class="text-xs text-gray-500 text-center py-4">No messages received yet.</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        document.getElementById('user-status').innerText = `User ID: ${tg.initDataUnsafe.user?.id || 'Guest'}`;

        let currentLogin = '';
        let currentDomain = '';

        async function generateMail(type) {
            try {
                tg.HapticFeedback.impactOccurred('medium');
                let name = type === 'custom' ? document.getElementById('custom-name').value.trim() : 'user' + Math.floor(Math.random() * 899999 + 100000);
                if(!name) return tg.showAlert('Please enter a custom name!');

                let domRes = await fetch('https://www.1secmail.com/api/v1/?action=getDomainList');
                let domains = await domRes.json();
                
                currentLogin = name.toLowerCase();
                currentDomain = domains[0] || '1secmail.com';
                
                let fullEmail = `${currentLogin}@${currentDomain}`;
                document.getElementById('current-email').innerText = fullEmail;
                
                tg.showAlert('Mail Generated Successfully!');
                fetchMessages();
            } catch(e) {
                tg.showAlert('Connection Error, please try again!');
            }
        }

        function copyMail() {
            let email = document.getElementById('current-email').innerText;
            if(email === 'No Mail Generated') return;
            navigator.clipboard.writeText(email);
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('Copied Email!');
        }

        async function fetchMessages() {
            if(!currentLogin || !currentDomain) return;
            try {
                let res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
                let messages = await res.json();
                let container = document.getElementById('inbox-list');
                container.innerHTML = '';

                if(messages.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">No messages received yet.</p>';
                    return;
                }

                for(let msg of messages) {
                    let msgDetail = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${msg.id}`).then(r => r.json());
                    let otpMatch = (msgDetail.textBody || msgDetail.body || '').match(/\b\d{4,6}\b/);
                    let otpHTML = otpMatch ? `<span class="bg-indigo-500/30 text-indigo-300 font-bold px-2 py-0.5 rounded text-xs ml-2">OTP: ${otpMatch[0]}</span>` : '';
                    
                    container.innerHTML += `
                        <div class="bg-gray-800 border border-gray-700 rounded-xl p-3">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-semibold text-gray-300">${msg.from}</span>
                                ${otpHTML}
                            </div>
                            <h4 class="text-xs font-bold text-white mb-1">${msg.subject}</h4>
                            <p class="text-xs text-gray-400 line-clamp-2">${msgDetail.textBody || 'No Text Content'}</p>
                        </div>
                    `;
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
